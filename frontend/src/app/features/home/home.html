<!-- Hero principal: imagen + textos + botón -->
<section class="mx-auto w-[90%] md:w-[75%] pt-4">
    <div class="relative overflow-hidden rounded-xl mt-10">
        <!-- Imagen de fondo -->
        <img
                src="fondo.png"
                alt="Oferta destacada"
                class="w-full h-[260px] md:h-[320px] object-cover object-left"
        />

        <!-- Overlay para mejorar legibilidad -->
        <div class="absolute inset-0 bg-black/55 md:bg-transparent md:bg-gradient-to-l md:from-black/85 md:via-black/60 md:to-black/0"></div>

        <!-- Contenido del hero (alineado a la derecha en desktop, centrado en móvil) -->
        <div class="absolute inset-0 flex items-center justify-center md:justify-end">
            <div class="w-full px-6 md:px-10 text-white text-center md:text-left max-w-none md:max-w-xl md:mr-20 flex flex-col items-center md:items-end">
                <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight drop-shadow">{{ 'HOME.HERO_TITLE' | translate }}</h1>

                <!-- Texto en dos líneas -->
                <p class="mt-3 text-lg md:text-2xl font-semibold leading-tight drop-shadow md:text-right">
                    {{ 'HOME.HERO_SUBTITLE' | translate }}
                </p>

                <!-- Botón más ancho y centrado -->
                <a
                        routerLink="/ratones"
                        class="inline-flex mt-5 bg-[#CC0000] hover:bg-[#990000] text-white font-semibold text-sm md:text-base px-6 py-3 rounded-lg items-center justify-center min-w-[160px] md:min-w-[200px]"
                        aria-label="Comprar ahora"
                >
                    {{ 'HOME.BUY_NOW' | translate }}
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Sección: Ratones desde API como tarjetas -->
<section class="mx-auto w-[90%] md:w-[75%] mt-8 mb-12">
  <h2 class="text-2xl md:text-3xl font-bold mb-5">{{ 'HOME.FEATURED_PRODUCTS_TITLE' | translate }}</h2>

  <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-6">
    <app-product-card *ngFor="let raton of ratones"
      [product]="raton" [link]="rutaProducto(raton)" [image]="getImageUrl(raton.image)"
      [rating]="getRatingValue(raton.id)" [reviews]="getOpiniones(raton.id)" [featured]="true">
    </app-product-card>
  </div>
</section>

<section class="w-full py-12 md:py-20 flex flex-col items-center justify-center bg-white text-black relative overflow-hidden">

    <div class="z-10 text-center px-4 w-full max-w-4xl mx-auto">
        <!-- Error Code -->
        <h1 class="text-6xl md:text-8xl font-extrabold text-[#CC0000] drop-shadow-sm tracking-tighter mb-2">
            🔒
        </h1>
        
        <!-- Title -->
        <h2 class="text-2xl md:text-4xl font-bold mb-4">
            {{ 'ERRORS.FORBIDDEN_TITLE' | translate }}

        <!-- Description -->

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">

                {{ 'LOGIN.TITLE' | translate }}
            </a>
        </div>

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />

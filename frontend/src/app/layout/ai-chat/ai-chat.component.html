<!-- Botón flotante del chat -->
<div class="fixed bottom-4 right-4 z-50">
  <!-- Ventana del chat -->
  <div *ngIf="isOpen" class="absolute bottom-16 right-0 bg-white rounded-lg shadow-2xl border border-gray-200 w-80 sm:w-96 h-96 flex flex-col animate-slide-up">
    <!-- Header del chat -->
    <div class="bg-red-600 text-white p-4 rounded-t-lg flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center">
          <img src="Logo_Blanco.webp" alt="GoGaming" class="w-5 h-5">
        </div>
        <div>
          <h3 class="font-semibold text-sm">Asistente Virtual</h3>
          <p class="text-xs text-red-100">GoGaming</p>
        </div>
      </div>
      <button (click)="toggleChat()" class="text-white hover:text-gray-200 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Área de mensajes -->
    <div #messagesContainer class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
      <div *ngFor="let message of messages" class="flex items-start" [ngClass]="{'justify-end': message.isUser, 'justify-start': !message.isUser}">
        <!-- Avatar de IA (solo cuando no es usuario) -->
        <div *ngIf="!message.isUser" class="flex-shrink-0 mr-2">
          <div class="w-8 h-8 rounded-full flex items-center justify-center bg-black">
            <img src="Logo_Blanco.webp" alt="GoGaming" class="w-5 h-5">
          </div>
        </div>
        
        <!-- Mensaje -->
        <div class="max-w-xs lg:max-w-md px-3 py-2 rounded-lg text-sm" 
             [ngClass]="{
               'bg-red-600 text-white': message.isUser,
               'bg-white text-gray-800 border border-gray-200': !message.isUser
             }">
          <p class="whitespace-pre-wrap">{{ message.content }}</p>
          <p class="text-xs mt-1 opacity-70">
            {{ message.timestamp | date:'HH:mm' }}
          </p>
        </div>
        
        <!-- Avatar de Usuario (solo cuando es usuario) -->
         <div *ngIf="message.isUser" class="flex-shrink-0 ml-2">
           <img
             [src]="getUserPhotoUrl() || getDefaultAvatar()"
             class="w-8 h-8 rounded-full object-cover border-2 border-red-500"
             alt="Foto de perfil"
           />
         </div>
      </div>

      <!-- Indicador de carga -->
      <div *ngIf="isLoading" class="flex items-start space-x-2 justify-start">
        <!-- Avatar de IA -->
        <div class="flex-shrink-0">
          <div class="w-8 h-8 rounded-full flex items-center justify-center bg-green-500">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
              <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path>
            </svg>
          </div>
        </div>
        
        <!-- Mensaje de carga -->
        <div class="bg-white text-gray-800 border border-gray-200 px-3 py-2 rounded-lg text-sm">
          <div class="flex items-center space-x-1">
            <div class="flex space-x-1">
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
            <span class="text-xs text-gray-500 ml-2">Escribiendo...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input de mensaje -->
    <div class="p-4 border-t border-gray-200 bg-white rounded-b-lg">
      <div class="flex space-x-2">
        <input
          type="text"
          [(ngModel)]="currentMessage"
          (keypress)="onKeyPress($event)"
          [disabled]="isLoading"
          placeholder="Escribe tu pregunta..."
          class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent disabled:bg-gray-100 disabled:cursor-not-allowed">
        <button
          (click)="sendMessage()"
          [disabled]="!currentMessage.trim() || isLoading"
          class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Botón para abrir el chat -->
  <button
    (click)="toggleChat()"
    class="bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-lg transition-all duration-300 transform hover:scale-110 focus:outline-none focus:ring-4 focus:ring-red-300">
    <svg *ngIf="!isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
    </svg>
    <svg *ngIf="isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </button>

  <!-- Indicador de notificación (opcional) -->
  <div class="absolute -top-2 -right-2 w-4 h-4 bg-red-500 rounded-full animate-pulse" *ngIf="false">
    <span class="sr-only">Nueva notificación</span>
  </div>
</div>

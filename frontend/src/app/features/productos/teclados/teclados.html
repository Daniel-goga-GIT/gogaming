<div class="min-h-screen bg-white text-gray-900 pb-12">

  <section class="mx-auto w-[90%] md:w-[75%] pt-4">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mt-10 mb-8">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">{{ 'PRODUCTS.TECLADOS_TITLE' | translate }}</h1>

      <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
        <div class="relative flex-1 sm:min-w-[300px]">
          <input
            type="text"
            [(ngModel)]="filterValue"
            (keyup.enter)="applyFilter()"
            [placeholder]="'LIST.SEARCH_PLACEHOLDER' | translate"
            class="w-full bg-white border border-gray-200 rounded-lg px-4 py-2 text-sm text-gray-900 focus:ring-1 focus:ring-red-600 outline-none shadow-sm"
          >
          <button (click)="applyFilter()" class="absolute right-3 top-2 p-1 text-gray-400 hover:text-red-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>

        <select
          [(ngModel)]="sortColumn"
          (change)="fetchTeclados()"
          class="bg-white border border-gray-200 rounded-lg px-4 py-2 text-sm text-gray-700 outline-none focus:ring-1 focus:ring-red-600 shadow-sm cursor-pointer"
        >
          <option value="nombre">{{ 'LIST.SORT_NAME' | translate }}</option>
          <option value="precio">{{ 'LIST.SORT_PRICE' | translate }}</option>
          <option value="marca">{{ 'LIST.SORT_BRAND' | translate }}</option>
          <option value="stock">{{ 'LIST.SORT_STOCK' | translate }}</option>
        </select>

        <div class="flex items-center gap-2">
          <button
            (click)="handlePageChange(currentPage - 1)" [attr.aria-label]="'LIST.PREV' | translate"
            [disabled]="currentPage === 0"
            class="p-2 rounded border border-gray-200 text-gray-400 hover:text-red-600 disabled:opacity-30 transition-all"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>

          <div class="flex items-center gap-1">
            <span class="text-sm font-bold text-red-600 px-3 py-1 bg-red-50 rounded">
              {{ currentPage + 1 }}
            </span>
            <span class="text-sm text-gray-400 px-2">{{ 'LIST.OF' | translate }} {{ totalPages }}</span>
          </div>

          <button
            (click)="handlePageChange(currentPage + 1)" [attr.aria-label]="'LIST.NEXT' | translate"
            [disabled]="currentPage >= totalPages - 1"
            class="p-2 rounded border border-gray-200 text-gray-400 hover:text-red-600 disabled:opacity-30 transition-all"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-8 flex items-center gap-3">
      {{ error }}
    </div>

    <div *ngIf="loading" class="flex justify-center py-24">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-red-600"></div>
    </div>

    <div *ngIf="!loading">
      <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-6">
        <app-product-card *ngFor="let teclado of teclados"
          [product]="teclado" [link]="['/productos/teclado', teclado.id]" [image]="getImageUrl(teclado.image)"
          [rating]="getRatingValue(teclado.id)" [reviews]="getOpiniones(teclado.id)">
        </app-product-card>
      </div>

      <div class="mt-12 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-gray-100 pt-8">
        <p class="text-sm text-gray-500">
          {{ 'LIST.SHOWING' | translate: { count: teclados.length, total: totalElements } }}
        </p>

        <div class="flex items-center gap-2">
          <button
            (click)="handlePageChange(currentPage - 1)" [attr.aria-label]="'LIST.PREV' | translate"
            [disabled]="currentPage === 0"
            class="p-2 rounded border border-gray-200 text-gray-400 hover:text-red-600 disabled:opacity-30 transition-all"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>

          <div class="flex items-center gap-1">
            <span class="text-sm font-bold text-red-600 px-3 py-1 bg-red-50 rounded">
              {{ currentPage + 1 }}
            </span>
            <span class="text-sm text-gray-400 px-2">{{ 'LIST.OF' | translate }} {{ totalPages }}</span>
          </div>

          <button
            (click)="handlePageChange(currentPage + 1)" [attr.aria-label]="'LIST.NEXT' | translate"
            [disabled]="currentPage >= totalPages - 1"
            class="p-2 rounded border border-gray-200 text-gray-400 hover:text-red-600 disabled:opacity-30 transition-all"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</div>

spring.application.name=gogaming-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always


spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=ERROR
spring.datasource.hikari.maximum-pool-size=10
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=${UPLOAD_PATH}

jwt.keystore.path=${JWT_KEYSTORE_PATH}
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
jwt.keystore.alias=${JWT_KEYSTORE_ALIAS:jwt-keypair}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_BASE_URL}}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${PASSWORD_EMAIL_SMTP}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mvc.converters.preferred-json-mapper=jackson
spring.http.encoding.force=false
spring.servlet.multipart.resolve-lazily=true
spring.mandatory-file-encoding=UTF-8

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback

app.frontend.oauth2.redirect-uri=${FRONTEND_OAUTH2_REDIRECT_URI:${FRONTEND_BASE_URL}/oauth2/callback}

app.frontend.base-url=${FRONTEND_BASE_URL}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method

# Detrás de un proxy inverso (nginx, Render, Railway...) poner FORWARD_HEADERS_STRATEGY=framework
# para que la IP del cliente y la URL pública (redirect de OAuth) sean las reales.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
